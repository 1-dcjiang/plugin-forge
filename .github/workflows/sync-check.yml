name: sync-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 只需要读仓库内容；探针用 GitHub 公开 API，带 github.token 提限额
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check (all python scripts)
        run: |
          python -m py_compile scripts/generate_roster_tables.py
          python -m py_compile skills/plugin-forge/scripts/check_contract_approval.py
          python -m py_compile skills/plugin-forge/scripts/security_audit.py
          python -m py_compile skills/neko-plugin-sandbox/scripts/sandbox.py
          python -m py_compile scripts/session_capability_refresh.py
          python -m py_compile scripts/profile_drift.py
      - name: Roster generator self-test
        run: python scripts/generate_roster_tables.py --self-test
      - name: Roster tables and head-counts in sync
        run: python scripts/generate_roster_tables.py --check
      - name: Contract gate self-test
        run: python skills/plugin-forge/scripts/check_contract_approval.py --self-test
      - name: Security audit self-test
        run: python skills/plugin-forge/scripts/security_audit.py --self-test
      - name: Sandbox self-test
        run: python skills/neko-plugin-sandbox/scripts/sandbox.py --self-test
      - name: 干装载自检（阻塞）
        run: python skills/neko-plugin-sandbox/scripts/dry_load.py --self-test
      - name: 干装载对照样例（阻塞：好样例退 0、坏样例退 1）
        run: python skills/neko-plugin-sandbox/scripts/dry_load.py --demo-check
      - name: Drift probe self-test
        run: python scripts/profile_drift.py --self-test
      - name: SessionStart 能力刷新自检
        run: python scripts/session_capability_refresh.py --self-test
      - name: 对本仓库跑一次真实安全扫描（裸扫，不加 --allow）
        run: python skills/plugin-forge/scripts/security_audit.py .
      - name: '审计三个旗标转为阻塞（盲区 / 占位符严格档 / 畸形点位声明；作者 2026-11-17 定：warnings 当 errors）'
        run: |
          python skills/plugin-forge/scripts/security_audit.py . --fail-unclear
          python skills/plugin-forge/scripts/security_audit.py . --strict-placeholder
          python skills/plugin-forge/scripts/security_audit.py . --strict-declared
      - name: 'profile 锚点漂移探针（阻塞：行号漂即红；取不到上游重试三次）'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rc=2
          for i in 1 2 3; do
            # 默认 shell 是 bash -e：直接写「cmd; rc=$?」会在 python 非零时先退出，
            # 走不到 rc=$?，重试与 sleep 一次都不会发生（A734 的 N1）。用 || 接单子。
            rc=0
            python scripts/profile_drift.py --strict || rc=$?
            if [ "$rc" -ne 2 ]; then break; fi
            echo "取不到上游（限流或网络），第 $i 次重试"; sleep $((i * 15))
          done
          if [ "$rc" -eq 2 ]; then echo "重试三次仍取不到上游：这不算核过，也不算漂移"; fi
          exit "$rc"
      - name: JSON artifacts parse
        run: python -c "import json,glob;fs=glob.glob('**/*.json',recursive=True)+glob.glob('.claude-plugin/*.json');[json.load(open(p,encoding='utf-8-sig')) for p in fs]"
